name: Setup Godot
description: Скачивает Godot (Linux, headless) и шаблоны экспорта для Windows, кладёт godot в PATH. С кэшем.

inputs:
  version:
    description: Версия Godot (без суффикса -stable)
    default: "4.7.1"

runs:
  using: composite
  steps:
    - name: Кэш Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        key: godot-${{ inputs.version }}-linux-wintemplates

    - name: Скачать Godot и шаблоны
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        V="${{ inputs.version }}"
        BASE="https://github.com/godotengine/godot-builds/releases/download/${V}-stable"
        mkdir -p ~/godot ~/.local/share/godot/export_templates
        curl -fsSL -o /tmp/godot.zip "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d /tmp/godot
        mv "/tmp/godot/Godot_v${V}-stable_linux.x86_64" ~/godot/godot
        curl -fsSL -o /tmp/templates.tpz "$BASE/Godot_v${V}-stable_export_templates.tpz"
        # Из ~1 ГБ шаблонов нужны только Windows и version.txt.
        unzip -q /tmp/templates.tpz 'templates/windows_*' 'templates/version.txt' -d /tmp/tpl
        mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${V}.stable

    - name: Godot в PATH
      shell: bash
      run: |
        chmod +x ~/godot/godot
        echo "$HOME/godot" >> "$GITHUB_PATH"
