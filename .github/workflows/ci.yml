name: CI

# Каждый PR и каждый push в main: импорт, автотесты, пробная сборка Windows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Тесты и сборка Windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot

      - name: Импорт, тесты, экспорт
        run: bash .github/scripts/test_and_build.sh

      - name: Сборка для проверки
        uses: actions/upload-artifact@v4
        with:
          name: PhillipsMachine-windows-${{ github.sha }}
          path: build/PhillipsMachine.exe
          retention-days: 7
